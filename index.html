<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0E0E12" />
  <meta name="description" content="FRAMELESS Motion Path Animation Studio" />
  <title>FRAMELESS - Motion Path Animation Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Archivo+Black&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="app">
    <!-- ============ TOP BAR ============ -->
    <header class="topbar">
      <!-- Baris 1: brand + tombol aksi -->
      <div class="topbar__row topbar__row--main">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true"></span>
          <div class="brand__text">
            <div class="brand__name">FRAMELESS</div>
            <div class="brand__tag">Motion Path Studio</div>
          </div>
        </div>
        <div class="topbar__actions">
          <button class="icon-btn" id="btnReset" title="Reset" aria-label="Reset">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/></svg>
          </button>
          <button class="icon-btn" id="btnTheme" title="Ganti tema" aria-label="Ganti tema">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18" fill="currentColor"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>
          </button>
          <button class="icon-btn" id="btnExport" title="Export JSON" aria-label="Export JSON">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></svg>
          </button>
        </div>
      </div>
      <!-- Baris 2: play + timeline memanjang penuh -->
      <div class="topbar__row topbar__row--transport">
        <button class="btn-play" id="btnPlay" title="Play / Pause" aria-label="Play / Pause">
          <svg class="ico-play" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>
          <svg class="ico-pause" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        </button>
        <div class="scrubbar">
          <input type="range" id="scrubber" min="0" max="1000" value="0" step="1" aria-label="Garis waktu" />
          <span class="time" id="timeLabel">0%</span>
        </div>
      </div>
    </header>

    <!-- ============ LEFT RAIL (desktop only) ============ -->
    <aside class="rail rail--left" aria-label="Perkakas">
      <nav class="tools" id="desktopTools">
        <button class="tool is-active" data-tool="select"><span class="tool__icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3l16 7-7 2-2 7z"/></svg>
        </span><span class="tool__label">Select</span></button>
        <button class="tool" data-tool="path"><span class="tool__icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><circle cx="3" cy="17" r="1.6" fill="currentColor"/><circle cx="21" cy="7" r="1.6" fill="currentColor"/></svg>
        </span><span class="tool__label">Path</span></button>
        <button class="tool" data-tool="object"><span class="tool__icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2l10 10-10 10L2 12z"/></svg>
        </span><span class="tool__label">Object</span></button>
        <button class="tool" data-tool="erase"><span class="tool__icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14l6 6h9"/><path d="M4 14L14 4l6 6-10 10"/></svg>
        </span><span class="tool__label">Erase</span></button>
      </nav>
      <div class="rail__group">
        <div class="rail__title">Bentuk Objek</div>
        <div class="shape-grid" data-shapehost></div>
      </div>
      <div class="rail__group">
        <div class="rail__title">Hint</div>
        <p class="hint">Pilih <b>Path</b>, tap titik demi titik di kanvas untuk menggambar jalur. Lalu <b>Object</b> untuk menempel objek yang menyusuri jalur. <b>Select</b> untuk menggeser.</p>
      </div>
    </aside>

    <!-- ============ STAGE ============ -->
    <section class="stage" aria-label="Kanvas">
      <div class="canvas-wrap" id="canvasWrap">
        <svg id="canvas" class="canvas" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid meet">
          <defs>
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M 40 0 L 0 0 0 40" fill="none" class="grid-line" />
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#grid)" />
          <g id="layerPaths"></g>
          <g id="layerObjects"></g>
        </svg>
      </div>
      <div class="stage-hud">
        <span class="mode" id="stageHint">Select</span>
        <span class="coords" id="coords">x:0 y:0</span>
      </div>
      <div class="hint-toast" id="hintToast"></div>
    </section>

    <!-- ============ RIGHT RAIL (desktop only) ============ -->
    <aside class="rail rail--right" aria-label="Properti">
      <div class="panel" data-panelhost="anim"></div>
      <div class="panel" data-panelhost="obj"></div>
      <div class="panel" data-panelhost="design"></div>
    </aside>

    <!-- ============ BOTTOM TOOLBAR (mobile only) ============ -->
    <nav class="toolbar" id="mobileTools" aria-label="Perkakas">
      <button class="tool is-active" data-tool="select"><span class="tool__icon">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3l16 7-7 2-2 7z"/></svg>
      </span><span class="tool__label">Pilih</span></button>
      <button class="tool" data-tool="path"><span class="tool__icon">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><circle cx="3" cy="17" r="1.6" fill="currentColor"/><circle cx="21" cy="7" r="1.6" fill="currentColor"/></svg>
      </span><span class="tool__label">Jalur</span></button>
      <button class="tool" data-tool="object"><span class="tool__icon">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 2l10 10-10 10L2 12z"/></svg>
      </span><span class="tool__label">Objek</span></button>
      <button class="tool" data-tool="erase"><span class="tool__icon">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14l6 6h9"/><path d="M4 14L14 4l6 6-10 10"/></svg>
      </span><span class="tool__label">Hapus</span></button>
      <button class="tool tool--sheet" id="btnSheet"><span class="tool__icon">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
      </span><span class="tool__label">Atur</span></button>
    </nav>

    <!-- ============ STATUS BAR (desktop only) ============ -->
    <footer class="statusbar">
      <span id="statusObjects">Objek: 0</span>
      <span id="statusPoints">Titik jalur: 0</span>
      <span class="statusbar__spacer"></span>
      <span class="statusbar__credit">FRAMELESS Studio · for creative industry</span>
    </footer>
  </div>

  <!-- ============ MOBILE BOTTOM SHEET ============ -->
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" aria-label="Panel pengaturan">
    <div class="sheet__grab" id="sheetGrab">
      <div class="sheet__tabs">
        <button class="sheet__tab is-active" data-page="anim">Animasi</button>
        <button class="sheet__tab" data-page="obj">Objek</button>
        <button class="sheet__tab" data-page="design">Sistem</button>
      </div>
    </div>
    <div class="sheet__page is-active" data-page="anim"><div class="panel" data-panelhost="anim-m"></div></div>
    <div class="sheet__page" data-page="obj">
      <div class="rail__group" style="margin-bottom:16px;">
        <div class="rail__title">Bentuk Objek</div>
        <div class="shape-grid" data-shapehost></div>
      </div>
      <div class="panel" data-panelhost="obj-m"></div>
    </div>
    <div class="sheet__page" data-page="design"><div class="panel" data-panelhost="design-m"></div></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
